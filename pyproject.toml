[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robust-alpha-lab"
version = "0.1.0"
description = "Leakage-safe trend, volatility, and multi-asset rotation research engine"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "PyYAML>=6.0", "yfinance>=0.2.54"]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8", "ruff>=0.12"]
rotation = ["scikit-learn>=1.4", "hmmlearn>=0.3.2"]
live = ["ccxt>=4.4"]

[project.scripts]
alpha-lab = "alpha_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
